[project]
name = "agentic-clob-mcp"
version = "0.1.0"
description = "Simplified CLOB engine with MCP bridge, LLM agent, and evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "grpcio",
    "grpcio-tools",
    "sortedcontainers",
    "mcp[cli]",
    "pydantic>=2.0",
    "pydantic-ai",
    "anthropic",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "bridge", "agent", "evaluation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
